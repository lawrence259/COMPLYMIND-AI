spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Disable all @Scheduled tasks during integration tests to prevent hangs
app:
  scheduling:
    enabled: false
  storage:
    upload-dir: ./target/test-uploads
  security:
    jwt-secret: test-secret-key-for-ci-b81add02
  risk:
    weights:
      deadline-urgency: 0.35
      blocked-dependency: 0.30
      evidence-deficiency: 0.20
      unresolved-pendency: 0.15
    thresholds:
      low-max: 29
      medium-max: 59
      high-max: 79

logging:
  level:
    com.complymind: DEBUG
    org.springframework.security: WARN
