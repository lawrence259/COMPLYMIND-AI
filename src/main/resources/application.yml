spring:
  application:
    name: complymind-ai
  profiles:
    active: dev
  jpa:
    open-in-view: true
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  thymeleaf:
    cache: false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  storage:
    upload-dir: ./uploads/evidence
  security:
    jwt-secret: default-secret-change-in-prod-b81add02ddec4bf1973c
  risk:
    weights:
      deadline-urgency: 0.35
      blocked-dependency: 0.30
      evidence-deficiency: 0.20
      unresolved-pendency: 0.15
    thresholds:
      low-max: 29
      medium-max: 59
      high-max: 79

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Uses H2 in PostgreSQL compatibility mode for seamless local development and tests without external dependencies
    url: jdbc:h2:file:./data/complymind_dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    open-in-view: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/complymind}
    username: ${SPRING_DATASOURCE_USERNAME:complymind}
    password: ${SPRING_DATASOURCE_PASSWORD:complymind_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
