<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: htmlhead('Create Corrective Action')}"></head>
<body>

<div th:replace="~{layout :: page-structure(~{::#create-action-content}, 'actions')}">
    <div id="create-action-content">

        <nav aria-label="breadcrumb">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a th:href="@{/corrective-actions}">Auto-Recovery</a></li>
                <li class="breadcrumb-item active">New Corrective Action</li>
            </ol>
        </nav>

        <div class="card-cm" style="max-width: 650px; margin: 0 auto;">
            <h5 class="fw-bold mb-3 border-bottom pb-2">
                <i class="bi bi-tools text-primary"></i> Create Auto-Recovery Action
            </h5>

            <form th:action="@{/corrective-actions/create}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Target Compliance Application</label>
                    <select name="applicationId" class="form-select" required>
                        <option value="">-- Select Application --</option>
                        <option th:each="app : ${applications}" th:value="${app.id}"
                                th:text="${app.applicationNumber} + ' - ' + (${app.institution != null ? app.institution.name : 'N/A'})"
                                th:selected="${app.id == selectedAppId}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Action Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Re-survey and submit certified Land Title Deed" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Root Cause / Originating Blocker</label>
                    <input type="text" name="rootIssue" class="form-control"
                           th:value="${defaultRootIssue}"
                           placeholder="e.g. REQ-01: Land Title Deed rejected due to illegible registration stamp" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Action Description &amp; Instructions</label>
                    <textarea name="description" class="form-control" rows="3"
                              placeholder="Step-by-step resolution instructions for the assigned nodal officer..."></textarea>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Assign Responsible User</label>
                        <select name="assignedToUserId" class="form-select">
                            <option value="">-- Select Assignee --</option>
                            <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName} + ' (' + ${u.role} + ')'"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">Due Date</label>
                        <input type="date" name="dueDate" class="form-control" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Priority Level</label>
                    <select name="priority" class="form-select" required>
                        <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
                    </select>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/corrective-actions}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-semibold">Assign Corrective Action</button>
                </div>
            </form>
        </div>

    </div>
</div>

</body>
</html>
