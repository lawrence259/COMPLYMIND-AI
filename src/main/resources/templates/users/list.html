<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: htmlhead('User & Role Management')}"></head>
<body>

<div th:replace="~{layout :: page-structure(~{::#user-list-content}, 'users')}">
    <div id="user-list-content">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="fw-bold mb-1">User &amp; Role Management</h4>
                <p class="text-muted small mb-0">Role-based access control and institutional tenancy assignments</p>
            </div>
            <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createUserModal">
                <i class="bi bi-person-plus"></i> Add New User
            </button>
        </div>

        <div class="card-cm">
            <div class="table-responsive">
                <table class="table table-cm">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Assigned Institution</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td class="fw-bold text-dark" th:text="${u.username}">username</td>
                            <td th:text="${u.fullName}">Full Name</td>
                            <td th:text="${u.email}">email</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${u.role.name() == 'ADMIN' ? 'bg-danger' : (u.role.name() == 'REVIEWER' ? 'bg-primary' : (u.role.name() == 'COMPLIANCE_OFFICER' ? 'bg-warning text-dark' : 'bg-secondary'))}"
                                      th:text="${u.role}">
                                </span>
                            </td>
                            <td th:text="${u.institution != null ? u.institution.name : 'System-wide / Global'}">Institution</td>
                            <td>
                                <span th:if="${u.enabled}" class="badge bg-success-subtle text-success border border-success-subtle">Active</span>
                                <span th:unless="${u.enabled}" class="badge bg-secondary">Disabled</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Create User Modal -->
        <div class="modal fade" id="createUserModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/users/create}" method="post">
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold">Create System User</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="e.g. j.doe" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Full Name</label>
                                <input type="text" name="fullName" class="form-control" placeholder="John Doe" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Email</label>
                                <input type="email" name="email" class="form-control" placeholder="j.doe@institution.edu" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="Password" required minlength="6">
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Role</label>
                                <select name="role" class="form-select" required>
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Institution (for Institution Users)</label>
                                <select name="institutionId" class="form-select">
                                    <option value="">-- None / System-wide --</option>
                                    <option th:each="inst : ${institutions}" th:value="${inst.id}" th:text="${inst.name} + ' (' + ${inst.code} + ')'"></option>
                                </select>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-sm btn-primary">Create User</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
