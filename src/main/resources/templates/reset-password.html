<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | COMPLYMIND AI</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/complymind.css}">
</head>
<body class="login-page">

<div class="login-bg-gradient"></div>

<div class="login-container">
    <div class="login-card" style="max-width: 480px;">
        <div class="text-center mb-4">
            <div class="login-shield-icon">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h3 class="login-title">Set New Password</h3>
            <p class="login-subtitle">
                Account: <strong class="text-primary" th:text="${username}">user</strong>
            </p>
            <div class="login-sih-badge">
                <i class="bi bi-check2-circle"></i> Token Verified
            </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-exclamation-circle-fill"></i>
            <div th:text="${errorMessage}">Error message</div>
        </div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <div class="mb-3">
                <label class="form-label small fw-semibold">New Password</label>
                <div class="input-group cm-input-group">
                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                    <input type="password" name="newPassword" id="newPassword" class="form-control" placeholder="Minimum 6 characters" required minlength="6" autofocus>
                    <button class="input-group-text bg-transparent border-start-0 text-muted" type="button" onclick="togglePasswordVisibility('newPassword', this)" tabindex="-1">
                        <i class="bi bi-eye-slash"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <div class="password-strength-bar mb-1">
                    <div class="password-strength-fill" id="strengthFill"></div>
                </div>
                <div class="small text-muted" id="strengthLabel" style="font-size:0.75rem;">Password complexity indicator</div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold">Confirm New Password</label>
                <div class="input-group cm-input-group">
                    <span class="input-group-text"><i class="bi bi-check2-square"></i></span>
                    <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" placeholder="Re-enter new password" required minlength="6">
                    <button class="input-group-text bg-transparent border-start-0 text-muted" type="button" onclick="togglePasswordVisibility('confirmPassword', this)" tabindex="-1">
                        <i class="bi bi-eye-slash"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-check2-circle me-1"></i> Update &amp; Secure Password
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center text-muted" style="font-size:0.75rem;">
            <a th:href="@{/login}" class="text-decoration-none text-muted">&larr; Return to Sign In</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye';
    } else {
        input.type = 'password';
        icon.className = 'bi bi-eye-slash';
    }
}

const passInput = document.getElementById('newPassword');
const fill = document.getElementById('strengthFill');
const label = document.getElementById('strengthLabel');
passInput?.addEventListener('input', function() {
    const v = this.value;
    let score = 0;
    if (v.length >= 6) score++;
    if (v.length >= 10) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    const pct = (score / 5) * 100;
    fill.style.width = pct + '%';
    const colors = ['#be123c','#f97316','#f59e0b','#15803d','#15803d'];
    const labels = ['Very Weak','Weak','Fair','Good','Strong'];
    fill.style.backgroundColor = colors[score - 1] || '#e2e8f0';
    label.textContent = labels[score - 1] || 'Password complexity indicator';
});
</script>
</body>
</html>
