<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First-Time Setup | COMPLYMIND AI</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/complymind.css}">
</head>
<body class="login-page">

<div class="login-bg-gradient"></div>

<div class="login-container">
    <div class="login-card" style="max-width: 480px;">
        <div class="text-center mb-4">
            <div class="login-shield-icon">
                <i class="bi bi-shield-check-fill"></i>
            </div>
            <h3 class="login-title">Platform Setup</h3>
            <p class="login-subtitle">Initialize First-Time System Administrator</p>
            <div class="login-sih-badge">
                <i class="bi bi-shield-lock"></i> Mandatory Security Enrollment
            </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

        <div class="alert alert-info py-2 small mb-4 d-flex align-items-center gap-2">
            <i class="bi bi-info-circle-fill fs-5"></i>
            <div>Zero users detected in database. Enroll the primary platform administrator to enable role-based operational workflows.</div>
        </div>

        <form th:action="@{/setup/create}" method="post" id="setupForm">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Full Legal Name <span class="text-danger">*</span></label>
                <div class="input-group cm-input-group">
                    <span class="input-group-text"><i class="bi bi-person-badge-fill"></i></span>
                    <input type="text" name="fullName" class="form-control" placeholder="e.g. Dr. Rajesh Sharma" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Admin Username <span class="text-danger">*</span></label>
                <div class="input-group cm-input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="e.g. admin" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Institutional Email <span class="text-danger">*</span></label>
                <div class="input-group cm-input-group">
                    <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
                    <input type="email" name="email" class="form-control" placeholder="admin@complymind.ai" required>
                </div>
            </div>
            <div class="mb-2">
                <label class="form-label small fw-semibold">Master Password <span class="text-danger">*</span></label>
                <div class="input-group cm-input-group">
                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                    <input type="password" name="password" id="setupPassword" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
                </div>
            </div>
            <div class="mb-4">
                <div class="password-strength-bar mb-1">
                    <div class="password-strength-fill" id="strengthFill"></div>
                </div>
                <div class="small text-muted" id="strengthLabel" style="font-size:0.75rem;">Password complexity indicator</div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-rocket-takeoff me-1"></i> Initialize Platform &amp; Create Admin
            </button>
        </form>

        <div class="mt-4 pt-3 border-top text-center text-muted" style="font-size:0.75rem;">
            <div>AICTE Compliance Platform &bull; BCrypt Hashing</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const passInput = document.getElementById('setupPassword');
const fill = document.getElementById('strengthFill');
const label = document.getElementById('strengthLabel');
passInput?.addEventListener('input', function() {
    const v = this.value;
    let score = 0;
    if (v.length >= 6) score++;
    if (v.length >= 10) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;
    const pct = (score / 5) * 100;
    fill.style.width = pct + '%';
    const colors = ['#be123c','#f97316','#f59e0b','#15803d','#15803d'];
    const labels = ['Very Weak','Weak','Fair','Good','Strong'];
    fill.style.backgroundColor = colors[score - 1] || '#e2e8f0';
    label.textContent = labels[score - 1] || 'Password complexity indicator';
});
</script>
</body>
</html>
